name: tmp lock test
on: pull_request
permissions:
  contents: read
jobs:
  reusable:
    uses: ./.github/workflows/tmp-lock-called.yml
  transitive:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p site && echo ok > site/index.html
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
          retention-days: 1
