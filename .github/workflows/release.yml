name: Release

# - workflow_dispatch only. With upload_release=false (default) the run is a QA
#   build: test + package + Web demo, artifacts only, no Release is created.
#   Dispatch it against release/X.Y branches to verify a release candidate.
# - The GitHub Release is created only by an explicit dispatch with
#   upload_release=true on a v* tag ref (guarded below).
# - The release version/tag/zip name come from the ss_renpy package's
#   __version__ (PEP 440, e.g. 7.0.0b1 — the Ren'Py package's own version,
#   independent of SDK_VERSION.txt, which only pins which native SDK libs
#   download-sdk.sh fetches).
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload to GitHub Release (only effective on a v* tag ref)'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub Release as a pre-release (excludes it from releases/latest, breaking the stable download URL). Keep false so the latest/download link resolves.'
        type: boolean
        default: false

# Needed to create the release and upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# NOTE: both jobs check out the SpriteStudio-SDK submodule and download its
# Release assets, so they need the SpriteStudio-SDK repository and the release
# pinned by scripts/SDK_VERSION.txt to be reachable (no extra auth required).
jobs:
  # Headless verification gate: every engine-independent layer has a plain-
  # CPython test under tools/ (AGENTS.md §5), plus the Ren'Py lint. GL2
  # rendering cannot be verified here — sign it off locally (Shift+B /
  # scripts/run-demo.*) before releasing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # deploy-examples.sh converts the SDK's bundled test projects, so the
          # SpriteStudio-SDK submodule must be present.
          submodules: recursive

      # Fetches the pre-built SpriteStudio SDK libs (libssruntime/libssconverter
      # for linux included) into game/spritestudio/libs/.
      - name: Download SpriteStudio SDK libs
        run: bash scripts/download-sdk.sh

      # game/ss_assets/ is gitignored; the tests play these converted packs.
      - name: Generate example animation data
        run: bash scripts/deploy-examples.sh

      - name: Run headless test suite
        run: |
          for t in tools/verify_*.py tools/m0_smoke.py; do
            echo "::group::$t"
            python3 "$t"
            echo "::endgroup::"
          done

      - name: Fetch Ren'Py SDK
        run: bash scripts/fetch-renpy-sdk.sh

      - name: Lint (Ren'Py)
        run: renpy-sdk/renpy.sh . lint

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # deploy-examples.sh converts the SDK's bundled test projects, so the
          # SpriteStudio-SDK submodule must be present.
          submodules: recursive

      - name: Resolve release metadata from ss_renpy __version__
        id: meta
        run: |
          VERSION=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' game/spritestudio/python/ss_renpy/__init__.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Fail fast before the heavy build: uploading is only allowed from the
      # v* tag whose name matches ss_renpy.__version__ (the single source of
      # truth for the release version).
      - name: Verify tag matches package version
        if: ${{ inputs.upload_release }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::upload_release=true requires running on a v* tag ref (got $GITHUB_REF)"
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "${{ steps.meta.outputs.tag }}" ]]; then
            echo "::error::tag $GITHUB_REF_NAME != v\$__version__ (${{ steps.meta.outputs.tag }}) — bump ss_renpy.__version__ or retag"
            exit 1
          fi

      # Fetches the pre-built SpriteStudio SDK libs into game/spritestudio/libs/.
      - name: Download SpriteStudio SDK libs
        run: bash scripts/download-sdk.sh

      # Sanity-check that the libs actually landed before packaging.
      - name: Verify SDK libs present
        run: |
          test -f game/spritestudio/libs/VERSION
          ls -R game/spritestudio/libs

      # Zip game/spritestudio/ as a top-level `spritestudio/` folder so consumers
      # can drop it straight into their Ren'Py project's game/ directory.
      - name: Package game/spritestudio
        id: pkg
        run: |
          # Ship the license documents inside the drop-in folder so they travel
          # with every copy (the vendored FlatBuffers runtime is Apache-2.0,
          # which requires the license text to accompany redistribution).
          cp LICENSE.md THIRD_PARTY_NOTICES.md game/spritestudio/
          ARTIFACT="SSPlayerForRenPy-${{ steps.meta.outputs.version }}.zip"
          cd game
          zip -r -X "../$ARTIFACT" spritestudio \
            -x '*.rpyc' '*/__pycache__/*' '*/.DS_Store'
          cd ..
          # Version-less alias so README/docs can point at a stable
          # releases/latest/download/SSPlayerForRenPy.zip URL that never goes
          # stale (mirrors the SSPlayerForUnity release convention).
          ALIAS="SSPlayerForRenPy.zip"
          cp "$ARTIFACT" "$ALIAS"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          unzip -l "$ARTIFACT" | tail -n 5

      # --- Web export (playable demo, hosted on GitHub Pages) -------------
      # The heavy Ren'Py Web build lives here in the release pipeline; the Pages
      # workflow (pages.yml) only downloads the produced asset on release publish.
      # Needs the Ren'Py SDK + Web support on top of the SS web runtime libs the
      # Download SpriteStudio SDK libs step fetched above. Built on every run —
      # a QA dispatch (upload_release=false) is exactly what verifies the Web
      # export still builds.
      - name: Fetch Ren'Py SDK
        run: bash scripts/fetch-renpy-sdk.sh

      - name: Fetch Ren'Py Web support
        run: bash scripts/fetch-renpy-web.sh

      # Convert the SDK test projects into playback data under game/ss_assets/ so
      # the animations get bundled into the Web export's game.zip. Must run before
      # deploy-web.sh (the exporter packs game/ as-is).
      - name: Generate example animation data
        run: bash scripts/deploy-examples.sh

      - name: Build Web export
        run: bash scripts/deploy-web.sh web_out

      - name: Package Web demo
        id: webpkg
        run: |
          DEMO="SSPlayerForRenPy-web-demo-${{ steps.meta.outputs.version }}.zip"
          ( cd web_out && zip -r -X "../$DEMO" . -x '*/.DS_Store' )
          # Version-less alias so pages.yml (and README/docs) can point at a
          # stable releases/latest/download/<alias> URL that never goes stale.
          DEMO_ALIAS="SSPlayerForRenPy-web-demo.zip"
          cp "$DEMO" "$DEMO_ALIAS"
          echo "demo=$DEMO" >> "$GITHUB_OUTPUT"
          echo "demo_alias=$DEMO_ALIAS" >> "$GITHUB_OUTPUT"

      # Canonical checksum manifest so a consumer can verify a downloaded zip's
      # integrity (`sha256sum -c SHA256SUMS --ignore-missing`). Covers the
      # aliases too — they are byte-identical copies but download separately.
      - name: Generate SHA256SUMS
        run: |
          sha256sum \
            "${{ steps.pkg.outputs.artifact }}" \
            "${{ steps.pkg.outputs.alias }}" \
            "${{ steps.webpkg.outputs.demo }}" \
            "${{ steps.webpkg.outputs.demo_alias }}" \
            > SHA256SUMS
          cat SHA256SUMS

      # Always keep the outputs as a workflow artifact so a QA run
      # (upload_release=false) is inspectable even without a Release. The
      # version-less aliases are byte-identical copies, so only the pinned
      # zips are kept here (SHA256SUMS still lists the aliases; verify with
      # --ignore-missing).
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SSPlayerForRenPy-release-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.pkg.outputs.artifact }}
            ${{ steps.webpkg.outputs.demo }}
            SHA256SUMS
          if-no-files-found: error

      # The Release is created as a draft: publishing is what triggers pages.yml
      # (docs + Web demo deploy), so the generated notes get a final review
      # before going live. Publish it from the GitHub Releases page.
      - name: Upload package to release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SSPlayer for Ren'Py ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ inputs.prerelease }}
          # Ship the version-pinned zip, the stable alias, the Web demo
          # (version-pinned + stable alias) consumed by pages.yml, and the
          # checksum manifest.
          files: |
            ${{ steps.pkg.outputs.artifact }}
            ${{ steps.pkg.outputs.alias }}
            ${{ steps.webpkg.outputs.demo }}
            ${{ steps.webpkg.outputs.demo_alias }}
            SHA256SUMS
