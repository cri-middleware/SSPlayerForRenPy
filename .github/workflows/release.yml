name: Release

# Run manually from the Actions tab. The release version/tag come from the
# ss_renpy package's __version__ (the Ren'Py package's own version, independent
# of SDK_VERSION.txt, which only pins which native SDK libs download-sdk.sh fetches).
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the package to GitHub Releases'
        type: boolean
        default: true
      prerelease:
        description: 'Mark the GitHub Release as a pre-release (excludes it from releases/latest, breaking the stable download URL). Keep false so the latest/download link resolves.'
        type: boolean
        default: false

# Needed to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # deploy-examples.sh converts the SDK's bundled test projects, so the
          # SpriteStudio-SDK submodule must be present.
          submodules: recursive

      - name: Resolve release metadata from ss_renpy __version__
        id: meta
        run: |
          VERSION=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' game/spritestudio/python/ss_renpy/__init__.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Fetches the pre-built SpriteStudio SDK libs into game/spritestudio/libs/.
      # NOTE: the SpriteStudio-SDK release is still private, so this step cannot
      # succeed yet. It goes green once that repo/release is made public (planned),
      # at which point download-sdk.sh's plain curl works with no extra auth.
      - name: Download SpriteStudio SDK libs
        run: bash scripts/download-sdk.sh

      # Sanity-check that the libs actually landed before packaging.
      - name: Verify SDK libs present
        run: |
          test -f game/spritestudio/libs/VERSION
          ls -R game/spritestudio/libs

      # Zip game/spritestudio/ as a top-level `spritestudio/` folder so consumers
      # can drop it straight into their Ren'Py project's game/ directory.
      - name: Package game/spritestudio
        id: pkg
        run: |
          ARTIFACT="SSPlayerForRenPy-${{ steps.meta.outputs.version }}.zip"
          cd game
          zip -r -X "../$ARTIFACT" spritestudio \
            -x '*.rpyc' '*/__pycache__/*' '*/.DS_Store'
          cd ..
          # Version-less alias so README/docs can point at a stable
          # releases/latest/download/SSPlayerForRenPy.zip URL that never goes
          # stale (mirrors the SSPlayerForUnity release convention).
          ALIAS="SSPlayerForRenPy.zip"
          cp "$ARTIFACT" "$ALIAS"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          unzip -l "$ARTIFACT" | tail -n 5

      # Always keep the package as a workflow artifact so a run is useful even
      # when the Releases upload is turned off.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.artifact }}
          path: ${{ steps.pkg.outputs.artifact }}
          if-no-files-found: error

      # --- Web export (playable demo, hosted on GitHub Pages) -------------
      # The heavy Ren'Py Web build lives here in the release pipeline; the Pages
      # workflow (pages.yml) only downloads the produced asset on release publish.
      # Needs the Ren'Py SDK + Web support on top of the SS web runtime libs the
      # Download SpriteStudio SDK libs step fetched above. Skipped when not
      # uploading, since the demo is only useful once attached to a release.
      - name: Fetch Ren'Py SDK
        if: ${{ inputs.upload }}
        run: bash scripts/fetch-renpy-sdk.sh

      - name: Fetch Ren'Py Web support
        if: ${{ inputs.upload }}
        run: bash scripts/fetch-renpy-web.sh

      # Convert the SDK test projects into playback data under game/ss_assets/ so
      # the animations get bundled into the Web export's game.zip. Must run before
      # deploy-web.sh (the exporter packs game/ as-is).
      - name: Generate example animation data
        if: ${{ inputs.upload }}
        run: bash scripts/deploy-examples.sh

      - name: Build Web export
        if: ${{ inputs.upload }}
        run: bash scripts/deploy-web.sh web_out

      - name: Package Web demo
        id: webpkg
        if: ${{ inputs.upload }}
        run: |
          DEMO="SSPlayerForRenPy-web-demo-${{ steps.meta.outputs.version }}.zip"
          ( cd web_out && zip -r -X "../$DEMO" . -x '*/.DS_Store' )
          # Version-less alias so pages.yml (and README/docs) can point at a
          # stable releases/latest/download/<alias> URL that never goes stale.
          DEMO_ALIAS="SSPlayerForRenPy-web-demo.zip"
          cp "$DEMO" "$DEMO_ALIAS"
          echo "demo=$DEMO" >> "$GITHUB_OUTPUT"
          echo "demo_alias=$DEMO_ALIAS" >> "$GITHUB_OUTPUT"

      - name: Upload package to release
        if: ${{ inputs.upload }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SSPlayer for Ren'Py ${{ steps.meta.outputs.tag }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          # Ship the version-pinned zip, the stable alias, and the Web demo
          # (version-pinned + stable alias) consumed by pages.yml.
          files: |
            ${{ steps.pkg.outputs.artifact }}
            ${{ steps.pkg.outputs.alias }}
            ${{ steps.webpkg.outputs.demo }}
            ${{ steps.webpkg.outputs.demo_alias }}
