name: Release

# - workflow_dispatch only, and the ref decides. From a branch the run is a QA
#   build: test + package + Web demo, artifacts only, no Release is created.
#   Dispatch it against release/X.Y branches to verify a release candidate.
# - From a v* tag it also drafts the GitHub Release, unless upload_release is
#   turned off or the tag already has one (decided below).
# - The release version/tag/zip name come from the ss_renpy package's
#   __version__ (PEP 440, e.g. 7.0.0b1 — the Ren'Py package's own version,
#   independent of SDK_VERSION.txt, which only pins which native SDK libs
#   download-sdk.sh fetches).
# - Policy: a beta (X.Y.ZbN) is still published as the *latest* release, so
#   prerelease stays false — README / docs hand out the
#   releases/latest/download/SSPlayerForRenPy.zip link, which only resolves for
#   a non-prerelease release.
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Draft the GitHub Release, to publish by hand. Only from a v* tag that has no Release yet; from a branch the run is a build.'
        required: false
        default: true
        type: boolean

# Needed to create the release and upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# NOTE: both jobs check out the SpriteStudio-SDK submodule and download its
# Release assets, so they need the SpriteStudio-SDK repository and the release
# pinned by scripts/SDK_VERSION.txt to be reachable (no extra auth required).
jobs:
  # Headless verification gate: every engine-independent layer has a plain-
  # CPython test under tools/ (CONTRIBUTING.md, "Test"), plus the Ren'Py lint. GL2
  # rendering cannot be verified here — sign it off locally (Shift+B /
  # scripts/run-demo.*) before releasing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # deploy-examples.sh converts the SDK's bundled test projects, so the
          # SpriteStudio-SDK submodule must be present.
          submodules: recursive

      # Fetches the pre-built SpriteStudio SDK libs (libssruntime/libssconverter
      # for linux included) into game/spritestudio/libs/.
      - name: Download SpriteStudio SDK libs
        run: bash scripts/download-sdk.sh

      # game/ss_assets/ is gitignored; the tests play these converted packs.
      - name: Generate example animation data
        run: bash scripts/deploy-examples.sh

      # Through the runner, never a bare loop: a tool that cannot find its pack
      # prints SKIP and exits 0, and only the runner counts that as a failure.
      - name: Run headless test suite
        run: bash scripts/run-tests.sh verbose=yes

      - name: Fetch Ren'Py SDK
        run: bash scripts/fetch-renpy-sdk.sh

      # Without --error-code the lint exits 0 whatever it reports. Even with it,
      # an exception raised before the lint gets going (in an init block, say)
      # exits 0 and leaves only traceback.txt, so either file Ren'Py writes when
      # it fails is a failure here too.
      - name: Lint (Ren'Py)
        run: |
          rm -f traceback.txt errors.txt
          status=0
          renpy-sdk/renpy.sh . lint --error-code || status=$?
          for f in traceback.txt errors.txt; do
            if [ -f "$f" ]; then
              echo "::error::Ren'Py wrote $f during the lint:"
              cat "$f"
              status=1
            fi
          done
          exit "$status"

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # softprops/action-gh-release creates the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # deploy-examples.sh converts the SDK's bundled test projects, so the
          # SpriteStudio-SDK submodule must be present.
          submodules: recursive

      # The ref decides what the run is: a v* tag is a release, anything else is
      # a build, kept on the run and drafting nothing. A tag that already has a
      # Release, draft or published, keeps it as it is, so a run from an old tag
      # rebuilds without touching the files people have downloaded and checked
      # against its SHA256SUMS. To have a Release made again, delete it first.
      - name: Decide on the GitHub Release
        id: release
        if: inputs.upload_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::notice::${GITHUB_REF_NAME} is not a v* tag — a build, no Release."; exit 0 ;;
          esac
          if out="$(gh release view "$GITHUB_REF_NAME" --json isDraft 2>&1)"; then
            echo "::notice::${GITHUB_REF_NAME} already has a Release — left as it is. Delete it to have it made again."
          elif [ "$out" = "release not found" ]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi

      # scripts/build-release.sh IS the release: the SDK libs, the drop-in
      # spritestudio/ zip, the Web export and its zip, the stable version-less
      # aliases the README / docs / pages.yml fetch through, and SHA256SUMS over
      # all four. Every option is spelled out so a release cannot change because
      # a default did, and so this is the command a human runs locally to
      # produce the same files.
      #
      # It checks two things nothing else can: that the tag matches the
      # __version__ shipped inside the folder, and that the macOS
      # libssruntime.framework is still a bundle rather than a flattened copy
      # (zip follows symlinks unless told not to, which silently invalidates its
      # code signature — and consumers get that framework only through this zip).
      #
      # demo=build is what makes a QA dispatch from a branch worth running: the
      # Web export is the part most likely to break.
      - name: Build the release
        run: ./scripts/build-release.sh sdk=download demo=build out=release-dist verify=yes clean=yes

      # Always keep the outputs as a workflow artifact so a QA run is
      # inspectable without a Release. The version-less aliases are
      # byte-identical copies of their zips, so only the pinned ones are kept
      # here; SHA256SUMS still lists all four (verify with --ignore-missing).
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SSPlayerForRenPy-release-dist
          path: |
            release-dist/SSPlayerForRenPy-*.zip
            release-dist/SHA256SUMS
          if-no-files-found: error
          # A week, not the 90-day default. What is meant to last is attached to
          # the GitHub Release, which never expires; this is a copy for a run
          # that uploaded nothing. Artifact storage is an org-wide quota, and a
          # full one does not degrade — `upload-artifact` fails, so the release
          # build fails, in a step that has nothing to do with the release.
          retention-days: 7

      # The Release is created as a draft: publishing is what triggers pages.yml
      # (docs + Web demo deploy), so the generated notes get a final review
      # before going live. Publish it from the GitHub Releases page, choosing
      # "Set as a pre-release" / "Set as the latest release" there — the same
      # decision, made once, where the release is actually published, which is
      # why there is no prerelease input.
      - name: Upload package to release
        if: steps.release.outputs.draft == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: SpriteStudio Player for Ren'Py ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          # The version-pinned zips, their stable aliases (the Web demo one is
          # what pages.yml downloads), and the checksum manifest.
          files: |
            release-dist/*.zip
            release-dist/SHA256SUMS
