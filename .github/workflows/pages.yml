name: Deploy Pages

# Publish the MkDocs site plus the playable Ren'Py Web demo to GitHub Pages,
# via the artifact method (no gh-pages branch).
#
# Triggers on release publish and manual dispatch only (never on push) — this
# matches SSPlayerForWeb, and keeps the docs deploy off the hot path now that a
# release also produces the heavy Web demo. The demo itself is NOT built here;
# it is downloaded from the release asset produced by release.yml.
on:
  release:
    types: [published]
  workflow_dispatch:

# Artifact-based Pages deploy needs pages/id-token; contents:read is for
# `gh release download`. Note: no contents:write — the gh-pages branch is gone.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # Both steps below run the same scripts a contributor runs locally, rather than
      # repeating the commands here. Nothing builds the docs on a pull request, so there
      # is no PR run to catch a divergence between the two — the fewer places the build
      # is spelled out, the better.
      #
      # prepare-docs.sh creates .venv and installs the pins from docs/requirements.txt;
      # build-docs.sh then finds zensical there. (It falls back to PATH when there is no
      # venv, so a plain `pip install -r docs/requirements.txt` step would still work
      # here — but then CI and the README would be running different things.)
      - name: Install docs dependencies
        run: ./scripts/prepare-docs.sh

      # One build per locale - there is no plugin producing both from a single run any
      # more - English first, because the English build wipes site/ and the Japanese site
      # lives inside it at site/ja. build-docs.sh owns that order; the reason it exists is
      # that the opposite order silently publishes a site with no Japanese pages at all.
      #
      # --strict fails the build on broken links / missing nav entries, so a publish
      # aborts rather than deploying a site with a dead link.
      - name: Build docs, both locales (strict validation)
        run: ./scripts/build-docs.sh

      # Pull the Web demo produced by release.yml and drop it under /demo/.
      # On a release event, download from the exact triggering release; on manual
      # dispatch, fall back to the latest release. Runs after both locale builds:
      # the English one cleans site/, so anything dropped in before it is lost.
      - name: Add Web demo to site/demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="SSPlayerForRenPy-web-demo.zip"
          TAG="${{ github.event.release.tag_name }}"
          mkdir -p site/demo
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --pattern "$ASSET" --dir "$RUNNER_TEMP"
          else
            gh release download --pattern "$ASSET" --dir "$RUNNER_TEMP"
          fi
          unzip -q "$RUNNER_TEMP/$ASSET" -d site/demo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
