INHERIT: ./mkdocs.base.yml

docs_dir: docs/en
site_dir: site
site_url: "https://cri-middleware.github.io/SSPlayerForRenPy/"
site_description: "A Ren'Py integration for SpriteStudio"

theme:
  language: en

extra:
  site_root_prefix: ""
  social:
    - icon: material/motion-play
      link: https://cri-middleware.github.io/SpriteStudio-Docs/
      name: SpriteStudio Docs
    - icon: fontawesome/brands/github
      link: https://github.com/cri-middleware
      name: cri-middleware on GitHub
    - icon: material/web
      link: https://www.webtech.co.jp/spritestudio/
      name: SpriteStudio
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/spritestudio
      name: SpriteStudio on X

plugins:
  - search
  - redirects
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        Ren'Py player for visual-novel authors: launching the game from the Ren'Py launcher
        converts the SpriteStudio projects in `SpriteStudio_Source/`, and `show ringo wait1`
        shows one.
      sections:
        Using the Player:
          - index.md: "What the player is, its key features, and the related repositories."
          - setup.md: "Installing the player into a game: requirements, placing the library, where the `.ssab` files go, and updating or removing it."
          - import.md: "Converting `.sspj` into `.ssab`: the Auto Importer on launch, SSConverter GUI, `ssconverter-cli` for scripts and CI, the browser converter, and release builds with `.rpa` archives."
          - usage.md: "Every API used from a script: `show`, `SSPlayer` in screens, loop counts, control from Python, part tracking, part overrides, texture swaps for costumes and expressions, user data and signal events, utilities, and the Shift+B browser."
          - buttons.md: "`SSButton`, an animation as a Ren'Py button: a part of the animation per state, clicks only on chosen parts, reduced motion, and self-voicing."
          - export.md: "What this player adds to a desktop, Android, iOS or Web export."
          - limitations.md: "What this player does not support, or supports in part. The limitations every player shares are on the portal."
        For Player & SDK Developers:
          - development/build.md: "Building the player, using a changed copy in a game, the export helper scripts, and checking a change in Ren'Py."
          - development/architecture.md: "The player's layers, where the native library loads from, and why it is built the way it is."

nav:
  - 🏠 Home: index.md
  - 🚀 Setup Guide: setup.md
  - 🗂️ Asset Import: import.md
  - ▶️ Usage Guide: usage.md
  - 🔘 Buttons: buttons.md
  - 📦 Exporting your Game: export.md
  - 🛠️ For Player & SDK Developers:
      - Build Guide: development/build.md
      - How the Player Is Put Together: development/architecture.md
  - ⚠️ Limitations & Scope: limitations.md
